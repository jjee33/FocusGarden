<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Focus Garden application icon.

    A single potted sprout on the sage of the navigation rail, in the app's own
    palette. Deliberately simple: an icon is read at 16px in a taskbar, so this
    is a handful of shapes chosen to keep a legible silhouette when tiny.

    Constrained to plain paths and flat fills — Godot rasterises SVG through
    ThorVG, whose support for filters, masks and text is limited.
    See docs/ASSET_PLACEHOLDERS.md.
  -->
  <rect width="256" height="256" rx="56" fill="#41695A"/>

  <!-- Terracotta pot, tapered, with a rim that oversails slightly. -->
  <path d="M84 170 h88 l-12 56 a10 10 0 0 1 -10 8 h-44 a10 10 0 0 1 -10 -8 z" fill="#C26A45"/>
  <rect x="76" y="152" width="104" height="22" rx="7" fill="#A9563A"/>

  <!-- Soil showing in the opening. -->
  <ellipse cx="128" cy="157" rx="42" ry="7" fill="#4A3B2A"/>

  <!-- Stem. -->
  <path d="M128 152 C126 122 126 102 128 80" stroke="#5B8C4A" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- Two leaves, mirrored, the upper one lighter so it reads as lit from above. -->
  <path d="M128 120 C104 118 86 102 84 78 C110 76 126 92 128 120 Z" fill="#5B8C4A"/>
  <path d="M128 106 C152 102 170 84 172 60 C146 60 130 78 128 106 Z" fill="#7FB069"/>

  <!-- A bud, in the same amber as the lantern glow in the app. -->
  <circle cx="128" cy="68" r="13" fill="#E0A340"/>
  <circle cx="128" cy="68" r="6" fill="#F7D08A"/>
</svg>
