<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E9DFC9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191D1A" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A cosy garden grown from the time you invest in yourself." />
    <title>Focus Garden</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking the first paint. As a plain stylesheet this cost
      ~2.6s to first contentful paint on throttled mobile: the browser will not
      draw anything until a render-blocking sheet from a third-party origin has
      resolved DNS, connected, and downloaded.

      media="print" makes it non-blocking, and the onload flips it to all once it
      has arrived. Both faces already carry display=swap, so text paints in the
      fallback stack immediately and swaps when the webfont lands - the fallbacks
      are chosen to make that swap unremarkable rather than a lurch.
    -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Public+Sans:wght@400..700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Public+Sans:wght@400..700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!--
      A real first paint, before any JavaScript.

      The app is a pure SPA: #root was empty, so nothing at all appeared until
      112 kB of JS had downloaded, parsed and mounted - which on throttled mobile
      is most of a second of blank screen and was the whole of the remaining
      Lighthouse performance gap. This is the same wordmark and ground colour the
      app itself opens with, so the transition is a fill-in rather than a flash.

      Styles are inline for the same reason: an external stylesheet is another
      round trip this must not wait for. createRoot replaces the contents on
      mount, so there is no hydration contract to keep - only a visual one.
    -->
    <style>
      #boot{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:.35rem;background:#e9dfc9;color:#2b2519;
        font-family:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif}
      #boot b{font-family:"Fraunces","Iowan Old Style",Georgia,serif;font-size:1.5rem;font-weight:600}
      #boot span{font-size:.85rem;color:#675c4a}
      @media (prefers-color-scheme:dark){
        #boot{background:#191d1a;color:#ede7d8}
        #boot span{color:#a09c8c}
      }
    </style>
    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <b>Focus Garden</b>
        <span>grow what you give time to</span>
      </div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
